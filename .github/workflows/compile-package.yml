name: Compile 'dist' from sources

on:

  workflow_dispatch:

  workflow_call:
    inputs:
      ignore-cache:
        required: false
        type: boolean
        description: build without node_modules cache

jobs:
  build:
    permissions:
      actions: read
      contents: read
    uses: IT-Service-NPM/.github/.github/workflows/compile-npm-package-pnpm.yml@main
    secrets: inherit
